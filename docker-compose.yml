version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rti
      POSTGRES_USER: rti
      POSTGRES_PASSWORD: rti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # chroma:
  #   image: chromadb/chroma
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma

volumes:
  postgres_data:
