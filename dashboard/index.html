<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTI Multi-Agent Dashboard</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2029; --panel2:#222a35; --line:#2c3542;
    --fg:#e6edf3; --muted:#8b97a7; --accent:#4c9aff; --ok:#3fb950;
    --warn:#d29922; --flag:#f85149; --chip:#30363d;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .launch { margin-left:auto; display:flex; gap:8px; }
  select, button { font:inherit; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--fg); padding:6px 10px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:var(--ok); border-color:var(--ok); color:#04260f; }
  button.flag { background:var(--flag); border-color:var(--flag); color:#2a0705; }
  button:disabled { opacity:.5; cursor:default; }
  .wrap { display:grid; grid-template-columns:300px 1fr 320px; gap:0; height:calc(100vh - 56px); }
  .col { overflow-y:auto; padding:16px; }
  .col.left { border-right:1px solid var(--line); }
  .col.right { border-left:1px solid var(--line); }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .qitem { cursor:pointer; }
  .qitem.sel { border-color:var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .title { font-weight:600; }
  .chip { font-size:11px; padding:2px 8px; border-radius:20px; background:var(--chip); color:var(--fg); white-space:nowrap; }
  .chip.processing { background:#1f3a5f; color:#9dc7ff; }
  .chip.awaiting_review { background:#3a2f10; color:#f0c674; }
  .chip.completed { background:#12331d; color:#7ee2a0; }
  .chip.error { background:#3a1512; color:#ff9d94; }
  .days { font-size:12px; }
  .days.risk { color:var(--flag); font-weight:600; }
  .bar { height:6px; background:var(--panel2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .qcard .stat { font-size:11px; }
  .status-approved,.status-auto_approved { color:var(--ok); }
  .status-flagged { color:var(--flag); }
  .status-pending,.status-processing { color:var(--muted); }
  .draft { background:var(--panel2); border-radius:6px; padding:10px; margin:8px 0; white-space:pre-wrap; }
  .cite { font-size:12px; color:var(--muted); }
  .exem { font-size:12px; padding:8px; border-radius:6px; margin-top:6px; }
  .exem.flagged { background:#2a1512; color:#ffb3ab; border:1px solid #5c2018; }
  .exem.safe { background:#12251a; color:#8fe0aa; border:1px solid #1f4a2e; }
  .review-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .quick { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .quick button { font-size:11px; padding:4px 8px; }
  input[type=text] { flex:1; min-width:180px; font:inherit; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--fg); }
  .trace { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .trace .ev { padding:4px 0; border-bottom:1px solid var(--line); }
  .trace .node { color:var(--accent); }
  .sla { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .metric .n { font-size:22px; font-weight:700; }
  .metric .l { font-size:11px; color:var(--muted); }
  .metric.risk .n { color:var(--flag); }
  .empty { color:var(--muted); font-style:italic; }
  .final { white-space:pre-wrap; background:var(--panel2); padding:12px; border-radius:8px; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>RTI Multi-Agent Dashboard</h1>
  <span class="sub">supervisor-orchestrated retrieval · drafting · exemption screening · human review gate</span>
  <div class="launch">
    <select id="sample"></select>
    <button class="primary" onclick="startRequest()">New request</button>
    <input type="file" id="file" accept=".pdf,.docx,.txt" style="display:none" onchange="uploadRequest()">
    <button onclick="document.getElementById('file').click()">Upload RTI</button>
  </div>
</header>

<div class="wrap">
  <div class="col left">
    <h2>Request Queue</h2>
    <div id="queue"></div>
  </div>

  <div class="col main">
    <div id="detail"><p class="empty">Select or start a request.</p></div>
  </div>

  <div class="col right">
    <h2>SLA &amp; Accountability</h2>
    <div class="sla" id="sla"></div>
    <h2 style="margin-top:20px">Live Execution Trace</h2>
    <div class="trace" id="trace"><p class="empty">No activity yet.</p></div>
  </div>
</div>

<script>
let selected = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadSamples() {
  const s = await api('/api/samples');
  document.getElementById('sample').innerHTML =
    s.map(x => `<option value="${x}">${x}</option>`).join('');
}

async function startRequest() {
  const sample = document.getElementById('sample').value;
  const { id } = await api('/api/requests', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ sample })
  });
  selected = id;
  refresh();
}

async function uploadRequest() {
  const input = document.getElementById('file');
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  try {
    const { id } = await api('/api/upload', { method:'POST', body: fd });
    selected = id;
    input.value = '';
    refresh();
  } catch (e) { alert('Upload failed: ' + e.message); }
}

function statusChip(s){ return `<span class="chip ${s}">${s.replace('_',' ')}</span>`; }

async function refreshQueue() {
  const q = await api('/api/requests');
  document.getElementById('queue').innerHTML = q.length ? q.map(r => {
    const pct = r.questions_total ? Math.round(100*r.questions_done/r.questions_total) : 0;
    const risk = (r.days_remaining !== null && r.days_remaining < 7) ? 'risk' : '';
    return `<div class="card qitem ${r.id===selected?'sel':''}" onclick="select('${r.id}')">
      <div class="row"><span class="title">${r.title}</span>${statusChip(r.status)}</div>
      <div class="row"><span class="days ${risk}">${r.days_remaining===null?'—':r.days_remaining+' days left'}</span>
        <span class="cite">${r.questions_done}/${r.questions_total} done</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('') : '<p class="empty">No requests yet.</p>';
}

function select(id){ selected = id; refresh(); }

function quick(text){
  const box = document.getElementById('instr');
  if (box) { box.value = text; box.focus(); }
}

async function decide(id, action){
  let instruction = null;
  if (action === 'instruct') {
    instruction = document.getElementById('instr').value.trim();
    if (!instruction) { alert('Enter a fix instruction first.'); return; }
  }
  const box = document.getElementById('instr');
  if (box) box.blur();                       // release focus so the pane can update
  await api(`/api/requests/${id}/decide`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, instruction })
  });
  refreshQueue(); refreshSla(); refreshDetail();   // force update after an action
}

function questionCard(q, rid, pending){
  const ex = q.exemption;
  const isReview = pending && pending.question_n === q.n;
  let exHtml = '';
  if (ex) exHtml = `<div class="exem ${ex.status}">${ex.status==='flagged'
      ? '⚠ '+(ex.category||'')+' — '+(ex.reason||'') : '✓ No exemption triggered'}</div>`;
  let review = '';
  if (isReview) {
    review = `<div class="review-actions">
        <button class="ok" onclick="decide('${rid}','approve')">Approve</button>
        <button class="flag" onclick="decide('${rid}','reject')">Reject (re-search)</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="instr" placeholder="Fix instruction, e.g. remove the address, keep the department name">
        <button class="primary" onclick="decide('${rid}','instruct')">Apply fix</button>
      </div>
      <div class="quick">
        <button onclick="quick('Remove any personal names.')">Remove name</button>
        <button onclick="quick('Remove the postal address.')">Remove address</button>
        <button onclick="quick('Add a privacy disclaimer and withhold personal identifiers.')">Add privacy disclaimer</button>
      </div>`;
  }
  const hist = (q.officer_history||[]).map(h => `<div class="cite">↳ ${h.action}${h.instruction?': '+h.instruction:''}</div>`).join('');
  return `<div class="card qcard">
    <div class="row"><span class="title">Q${q.n}</span>
      <span class="stat status-${q.status}">${q.status.replace('_',' ')}</span></div>
    <div style="margin:6px 0">${q.question_text}</div>
    <div class="cite">Departments: ${(q.departments||[]).join(', ')||'—'}</div>
    ${q.draft ? `<div class="draft">${q.draft}</div>`:''}
    ${q.citations&&q.citations.length ? `<div class="cite">Source(s): ${q.citations.join('; ')}</div>`:''}
    ${exHtml}${hist}${review}
  </div>`;
}

async function refreshDetail(){
  if (!selected) return;
  const prevInstr = document.getElementById('instr')?.value;   // preserve typed text
  const d = await api('/api/requests/'+selected);
  const risk = (d.days_remaining!==null && d.days_remaining<7)?'risk':'';
  let html = `<div class="row"><h2>${d.title}</h2>${statusChip(d.status)}</div>
    <div class="cite">Applicant: ${d.applicant||'—'} · Reference: ${d.reference||'—'}
      · <span class="days ${risk}">${d.days_remaining===null?'—':d.days_remaining+' days to deadline'}</span></div>`;
  if (d.status==='awaiting_review' && d.pending)
    html += `<div class="card" style="border-color:var(--warn)">Officer action required on Q${d.pending.question_n}.</div>`;
  html += (d.questions||[]).map(q => questionCard(q, d.id, d.pending)).join('');
  if (d.final_reply)
    html += `<h2 style="margin-top:16px">Assembled Final Reply</h2><div class="final">${d.final_reply}</div>`;
  document.getElementById('detail').innerHTML = html;
  const box = document.getElementById('instr');               // restore typed text
  if (box && prevInstr) box.value = prevInstr;

  // trace
  const t = d.trace||[];
  document.getElementById('trace').innerHTML = t.length ? t.slice().reverse().map(e =>
    `<div class="ev"><span class="node">${e.node}</span> <span class="cite">${e.t}</span><br>${e.message}</div>`).join('')
    : '<p class="empty">No activity yet.</p>';
}

async function refreshSla(){
  const s = await api('/api/sla');
  document.getElementById('sla').innerHTML = `
    <div class="metric"><div class="n">${s.requests_total}</div><div class="l">Requests</div></div>
    <div class="metric"><div class="n">${s.completed}</div><div class="l">Completed</div></div>
    <div class="metric risk"><div class="n">${s.at_risk}</div><div class="l">At risk (&lt;7d)</div></div>
    <div class="metric"><div class="n">${s.awaiting_review}</div><div class="l">Awaiting review</div></div>
    <div class="metric"><div class="n">${s.pct_needing_review}%</div><div class="l">Needed review</div></div>
    <div class="metric"><div class="n">${s.officer_rounds}</div><div class="l">Officer actions</div></div>`;
}

// Skip re-rendering the detail pane while the user is typing in a field or has
// text selected — otherwise the 2s poll would wipe focus, input, and selection.
function isInteracting(){
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return true;
  const sel = window.getSelection();
  return !!(sel && sel.toString().length);
}

function refresh(){
  refreshQueue();
  refreshSla();
  if (!isInteracting()) refreshDetail();
}

loadSamples();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
